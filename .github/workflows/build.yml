name: Build APK
on:
  push:
    branches: [truelog-camera]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, unit test, package
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: Run the real shaders on a software GPU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libegl-mesa0 libgl1-mesa-dri libgl1 libglx-mesa0
          pip install -q moderngl numpy
          python3 tools/shader_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: TrueLog-apk
          path: app/build/outputs/apk/release/*.apk

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Shader tests and app launch on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swangle_indirect -feature GLESDynamicVersion -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          disable-animations: true
          script: bash .github/scripts/emulator-checks.sh
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-reports
          path: |
            app/build/reports/androidTests/**
            emulator-logcat.txt
            emulator-*.png
            ui.xml
